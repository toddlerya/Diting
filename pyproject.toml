[project]
name = "diting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

